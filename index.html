<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Botsford Lunch Manager</title>

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Botsford Lunch">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f8;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    .card {
      width: min(92vw, 420px);
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 28px rgba(0,0,0,.10);
    }
    img {
      width: 132px;
      height: 132px;
      object-fit: contain;
      border-radius: 24px;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 18px; line-height: 1.45; color: #555; }
    .button {
      display: inline-block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      background: #1976d2;
      color: white;
      font-weight: 700;
      text-decoration: none;
      font-size: 17px;
    }
    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: #777;
    }
  </style>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      const standalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      if (standalone) {
        window.location.replace("https://script.google.com/a/macros/clarencevilleschools.org/s/AKfycbzrSQfOxhFDgWZhWYLj1ARbfDdI6KgeRcyeTW2HO3HrQrbO6EU5PrVkggV39HFRK31c/exec");
      }
    });
  </script>
</head>
<body>
  <main class="card">
    <img src="icon-512.png" alt="Botsford Lunch Manager apple logo">
    <h1>Botsford Lunch Manager</h1>
    <p>
      Add this page to your phone's Home Screen. After that, tapping the apple icon
      will open the regular Lunch Manager.
    </p>
    <a class="button" href="https://script.google.com/a/macros/clarencevilleschools.org/s/AKfycbzrSQfOxhFDgWZhWYLj1ARbfDdI6KgeRcyeTW2HO3HrQrbO6EU5PrVkggV39HFRK31c/exec">Open Lunch Manager</a>
    <div class="hint">
      iPhone: Share → Add to Home Screen<br>
      Android: browser menu → Add to Home screen / Install app
    </div>
  </main>
</body>
</html>
